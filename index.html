<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB THE SHOW 26 COOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; transition: background-color 0.3s; overflow-x: hidden; }
        .card { background-color: #1e293b; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
        .scoreboard-font { font-family: 'Courier New', Courier, monospace; }
        
        #hr-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 100; align-items: center; justify-content: center;
            flex-direction: column; animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .hr-text {
            font-size: 5rem; font-weight: 900; color: #fbbf24;
            text-shadow: 0 0 20px #fbbf24, 0 0 40px #d97706;
            animation: hr-bounce 0.5s infinite alternate;
        }
        @keyframes hr-bounce { from { transform: scale(1); } to { transform: scale(1.05); } }

        .out-dot { width: 14px; height: 14px; border-radius: 9999px; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.1); }
        
        /* Estilos del Rombo de las Bases */
        .base-diamond { width: 18px; height: 18px; background-color: #334155; transform: rotate(45deg); transition: all 0.3s; border: 1px solid rgba(255,255,255,0.2); }
        .base-active { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div id="hr-overlay">
        <div class="hr-text italic">HOME RUN!</div>
        <div class="mt-4 text-white text-2xl font-bold uppercase tracking-widest">¡HASTA LA LUNA! ⚾✨</div>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">MLB THE SHOW <span class="text-blue-500">26 COOP</span></h1>
                <p class="text-slate-400 font-medium italic">Beto vs Nasa Edition</p>
            </div>
            <div class="flex gap-2 bg-slate-800 p-1 rounded-xl">
                <button onclick="viewSection('game')" class="nav-btn px-4 py-2 rounded-lg font-semibold transition-all bg-blue-600 text-white" id="nav-game">🎮 Juego</button>
                <button onclick="viewSection('stats')" class="nav-btn px-4 py-2 rounded-lg font-semibold transition-all text-slate-400" id="nav-stats">📊 Histórico</button>
                <button onclick="viewSection('setup')" class="nav-btn px-4 py-2 rounded-lg font-semibold transition-all text-slate-400" id="nav-setup">⚙️ Equipo</button>
            </div>
        </header>

        <div id="live-scoreboard" class="card p-5 mb-6 border-b-4 border-blue-600 bg-slate-900">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex flex-col gap-3 w-full md:w-auto">
                    <div class="flex flex-wrap items-center gap-4">
                        <div id="game-status-indicator" class="px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest bg-red-500/20 text-red-400 border border-red-500/50">
                            ESPERANDO PARTIDO
                        </div>
                        <div id="inning-display" class="bg-blue-600 px-3 py-1 rounded-md text-xs font-black text-white flex items-center gap-1">
                            <span>ALTA 1</span> <span class="text-[10px]">▲</span>
                        </div>
                        
                        <div class="flex items-center gap-6 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 ml-2">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Bases:</span>
                            <div class="relative w-14 h-14 flex items-center justify-center">
                                <div id="base-2" class="base-diamond absolute top-0" title="Segunda Base"></div>
                                <div id="base-3" class="base-diamond absolute left-0" title="Tercera Base"></div>
                                <div id="base-1" class="base-diamond absolute right-0" title="Primera Base"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex gap-8 mt-1">
                        <div>
                            <p class="text-[10px] text-blue-400 font-black uppercase mb-2">Outs Bateando</p>
                            <div id="bat-outs" class="flex gap-2">
                                <div class="out-dot bg-slate-700"></div><div class="out-dot bg-slate-700"></div><div class="out-dot bg-slate-700"></div>
                            </div>
                        </div>
                        <div>
                            <p class="text-[10px] text-red-500 font-black uppercase mb-2">Outs Pitcheando</p>
                            <div id="pitch-outs" class="flex gap-2">
                                <div class="out-dot bg-slate-700"></div><div class="out-dot bg-slate-700"></div><div class="out-dot bg-slate-700"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-8 md:gap-12 items-center bg-slate-800/50 px-8 py-4 rounded-2xl border border-slate-700">
                    <div class="text-center">
                        <p class="text-[10px] text-blue-400 font-black uppercase mb-1">Anotadas</p>
                        <span id="score-runs" class="scoreboard-font text-5xl text-white">0</span>
                    </div>
                    <div class="text-slate-600 text-3xl font-black">VS</div>
                    <div class="text-center">
                        <p class="text-[10px] text-red-500 font-black uppercase mb-1">Permitidas</p>
                        <span id="score-allowed" class="scoreboard-font text-5xl text-white">0</span>
                    </div>
                </div>
            </div>
        </div>

        <section id="section-game" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-center gap-4 mb-4">
                <button id="btn-toggle-game" onclick="toggleGame()" class="px-8 py-3 bg-green-600 hover:bg-green-500 text-white rounded-full font-black text-lg shadow-lg flex items-center gap-3">
                    <span id="game-btn-icon">🏏</span> <span id="game-btn-text">EMPEZAR PARTIDO</span>
                </button>
            </div>

            <div id="game-controls" class="opacity-30 pointer-events-none grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card p-6 border-t-4 border-blue-500">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">🏏 Lineup de Bateo</h2>
                    </div>
                    <select id="activeBatter" onchange="manualUserChange()" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-slate-700 text-white font-black text-xl"></select>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="recordBatting('H')" class="p-3 bg-green-600/20 border border-green-600/50 rounded-lg font-bold text-green-400">1B</button>
                        <button onclick="recordBatting('2B')" class="p-3 bg-emerald-600/20 border border-emerald-600/50 rounded-lg font-bold text-emerald-400">2B</button>
                        <button onclick="recordBatting('3B')" class="p-3 bg-orange-600/20 border border-orange-600/50 rounded-lg font-bold text-orange-400">3B</button>
                        <button onclick="recordBatting('HR')" class="p-3 bg-yellow-600/20 border border-yellow-600/50 rounded-lg font-bold text-yellow-400">HR</button>
                        <button onclick="recordBatting('BB')" class="p-3 bg-blue-600/20 border border-blue-600/50 rounded-lg font-bold text-blue-400">BB</button>
                        <button onclick="recordBatting('RBI')" class="p-3 bg-purple-600/20 border border-purple-600/50 rounded-lg font-bold text-purple-400">RBI</button>
                        <button onclick="recordBatting('OUT')" class="p-3 bg-slate-700 rounded-lg font-bold">OUT</button>
                        <button onclick="recordBatting('K')" class="p-3 bg-red-600/20 border border-red-600/50 rounded-lg font-bold text-red-400">K</button>
                        
                        <button onclick="recordBatting('BR')" class="p-3 bg-cyan-600/20 border border-cyan-500/50 rounded-lg font-bold text-cyan-400" title="Robo de Base Exitoso">ROBO (BR)</button>
                        <button onclick="recordBatting('OR')" class="p-3 bg-rose-900/40 border border-rose-600/50 rounded-lg font-bold text-rose-400 col-span-3" title="Out Intentando Robar">OUT ROBANDO (OR)</button>
                    </div>
                    
                    <div class="mt-4 p-3 bg-slate-900/60 rounded-xl border border-slate-700/60">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2 text-center">Ajuste Manual de Almohadillas</p>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="toggleManualBase(1)" class="py-1 px-2 text-xs bg-slate-800 rounded font-medium border border-slate-700 text-slate-300">Alternar 1B</button>
                            <button onclick="toggleManualBase(2)" class="py-1 px-2 text-xs bg-slate-800 rounded font-medium border border-slate-700 text-slate-300">Alternar 2B</button>
                            <button onclick="toggleManualBase(3)" class="py-1 px-2 text-xs bg-slate-800 rounded font-medium border border-slate-700 text-slate-300">Alternar 3B</button>
                        </div>
                    </div>
                </div>

                <div class="card p-6 border-t-4 border-red-500">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">⚾ Bullpen (Defensa)</h2>
                    </div>
                    <select id="activePitcher" onchange="manualUserChange()" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-slate-700 text-white font-black text-xl"></select>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="recordPitching('K')" class="p-4 bg-red-600/20 border border-red-600/50 rounded-xl font-bold text-red-400">PONCHE (K)</button>
                        <button onclick="recordPitching('OUT')" class="p-4 bg-slate-700 border border-slate-600 rounded-xl font-bold">OUT (Contacto)</button>
                        <button onclick="recordPitching('HIT')" class="p-4 bg-orange-600/20 border border-orange-600/50 rounded-xl font-bold text-orange-400">HIT RECIBIDO</button>
                        <button onclick="recordPitching('BB')" class="p-4 bg-blue-600/20 border border-blue-600/50 rounded-xl font-bold text-blue-400">BB PERMITIDO</button>
                        
                        <button onclick="recordPitching('CS')" class="p-4 bg-teal-600/20 border border-teal-500/50 rounded-xl font-bold text-teal-400 col-span-2" title="Agarrar Corredor Robando">AGARRADO ROBANDO (CS)</button>
                        
                        <button onclick="recordPitching('ERR')" class="p-3 bg-amber-600/20 border border-amber-600/50 rounded-xl font-bold text-amber-400 col-span-2">ERROR COMETIDO (E)</button>
                        
                        <button onclick="recordPitching('ER')" class="p-4 bg-red-900/40 border border-red-900/50 rounded-xl font-bold text-red-200 col-span-2">CARRERA PERMITIDA</button>
                    </div>
                    <button onclick="changeInningSide()" class="mt-4 w-full p-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-black uppercase tracking-widest border border-slate-600">Cambiar Mitad del Inning Manulmente</button>
                </div>
            </div>
        </section>

        <section id="section-stats" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b-2 border-blue-600 pb-2">
                <h2 class="text-2xl font-black text-white uppercase">Estadísticas de Temporada</h2>
                <button onclick="resetSeasonStats()" class="bg-red-600 hover:bg-red-700 text-xs font-black px-4 py-2 rounded-lg tracking-wider">RESETEAR NÚMEROS</button>
            </div>
            <div id="statsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
        </section>

        <section id="section-setup" class="hidden">
            <div class="card p-6 max-w-md mx-auto">
                <h2 class="text-xl font-bold mb-4 text-center italic">Gestionar Equipo</h2>
                <div class="flex gap-2 mb-6">
                    <input type="text" id="playerNameInput" placeholder="Nombre..." class="flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white">
                    <button onclick="addPlayer()" class="btn-primary px-5 py-2 rounded-lg font-black">AÑADIR</button>
                </div>
                <div id="playerList" class="space-y-2"></div>
                <button onclick="clearHistory()" class="mt-8 text-red-500 text-xs font-black block mx-auto uppercase underline tracking-widest">Borrar Toda la Base de Datos</button>
            </div>
        </section>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 transform translate-y-24 opacity-0 transition-all duration-300 bg-white text-slate-900 px-8 py-4 rounded-2xl shadow-2xl font-black z-50 border-4 border-blue-600 text-center"></div>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBFCmkqnOiDWc5xvPct69euRqVWsbnbYAM",
            authDomain: "mlb-coop.firebaseapp.com",
            projectId: "mlb-coop",
            databaseURL: "https://mlb-coop-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let players = [];
        let isGameActive = false;
        // Registro de bases: false = vacía, true = ocupada
        let currentGameScore = { runs: 0, allowed: 0, pitchOuts: 0, batOuts: 0, inning: 1, isTopInning: true, bases: { b1: false, b2: false, b3: false } };
        let activeSelection = { batterId: "", pitcherId: "" };

        function save() {
            db.ref('gameData').set({ players, score: currentGameScore, isGameActive, activeSelection });
        }

        db.ref('gameData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                players = data.players || [];
                currentGameScore = data.score || { runs: 0, allowed: 0, pitchOuts: 0, batOuts: 0, inning: 1, isTopInning: true, bases: { b1: false, b2: false, b3: false } };
                if(!currentGameScore.bases) currentGameScore.bases = { b1: false, b2: false, b3: false };
                isGameActive = data.isGameActive || false;
                activeSelection = data.activeSelection || { batterId: "", pitcherId: "" };
                updateUI();
            }
        });

        function updateUI() {
            document.getElementById('score-runs').innerText = currentGameScore.runs;
            document.getElementById('score-allowed').innerText = currentGameScore.allowed;
            
            // Render del Inning con su parte respectiva (Alta / Baja)
            const sideText = currentGameScore.isTopInning ? "ALTA" : "BAJA";
            const sideArrow = currentGameScore.isTopInning ? "▲" : "▼";
            document.getElementById('inning-display').innerHTML = `<span>${sideText} ${currentGameScore.inning}</span> <span class="text-[10px]">${sideArrow}</span>`;
            
            // Actualización de los rombos de base en pantalla
            document.getElementById('base-1').className = `base-diamond absolute right-0 ${currentGameScore.bases.b1 ? 'base-active' : ''}`;
            document.getElementById('base-2').className = `base-diamond absolute top-0 ${currentGameScore.bases.b2 ? 'base-active' : ''}`;
            document.getElementById('base-3').className = `base-diamond absolute left-0 ${currentGameScore.bases.b3 ? 'base-active' : ''}`;

            const bDots = document.getElementById('bat-outs').children;
            const pDots = document.getElementById('pitch-outs').children;
            for(let i=0; i<3; i++) {
                bDots[i].style.backgroundColor = i < currentGameScore.batOuts ? '#3b82f6' : '#334155';
                pDots[i].style.backgroundColor = i < currentGameScore.pitchOuts ? '#ef4444' : '#334155';
            }

            updateStatusUI();
            renderStats();
            renderPlayerList();
            updateDropdowns();
        }

        function recordBatting(type) {
            const pid = activeSelection.batterId;
            if(!pid) return showToast("⚠️ SELECCIONA UN BATEADOR");
            const p = players.find(x => x.id == pid);
            
            // Forzar inicialización de todos los campos estadísticos requeridos
            if(!p.stats.extra) p.stats.extra = { h1: 0, h2: 0, h3: 0, bb: 0, outs: 0, sb: 0, cs: 0, errors: 0 };

            if (['H','2B','3B','HR','OUT','K'].includes(type)) p.stats.atBats++;
            if (['H','2B','3B','HR'].includes(type)) p.stats.hits++;
            
            if (type === 'H') { p.stats.extra.h1++; advanceRunners(1); }
            if (type === '2B') { p.stats.extra.h2++; advanceRunners(2); }
            if (type === '3B') { p.stats.extra.h3++; advanceRunners(3); }
            if (type === 'BB') { p.stats.extra.bb++; advanceRunners(1, true); }
            if (type === 'HR') { p.stats.hr++; p.stats.rbi++; currentGameScore.runs++; advanceRunners(4); showHR(); }
            if (type === 'RBI') { p.stats.rbi++; currentGameScore.runs++; }
            
            // Casos de Outs Bateando
            if (type === 'OUT' || type === 'K') { 
                p.stats.extra.outs++; 
                currentGameScore.batOuts++; 
            }
            
            // Casos de Robos
            if (type === 'BR') { 
                p.stats.extra.sb++; 
                showToast(`🏃‍♂️ ¡ROBO EXITOSO DE ${p.name.toUpperCase()}!`);
            }
            if (type === 'OR') { 
                p.stats.extra.cs++; 
                currentGameScore.batOuts++; 
                showToast(`❌ ATRAPADO ROBANDO EN BASE`);
            }

            if (type !== 'RBI' && type !== 'BR' && type !== 'OR') rotatePlayer('batter');
            
            // Verificación limpia de 3 outs de bateo por separado
            if (currentGameScore.batOuts >= 3) { 
                currentGameScore.batOuts = 0; 
                clearBases();
                showToast("🛑 3 OUTS BATEANDO - CAMBIO DE LADO"); 
            }
            save();
        }

        function recordPitching(type) {
            const pid = activeSelection.pitcherId;
            if(!pid) return showToast("⚠️ SELECCIONA UN PITCHER");
            const p = players.find(x => x.id == pid);
            if(!p.stats.extra) p.stats.extra = { h1: 0, h2: 0, h3: 0, bb: 0, outs: 0, sb: 0, cs: 0, errors: 0 };

            if (type === 'K') { p.stats.pk++; currentGameScore.pitchOuts++; }
            if (type === 'OUT') currentGameScore.pitchOuts++;
            if (type === 'ER') { p.stats.pruns++; currentGameScore.allowed++; }
            
            // Agarró robando (Pickoff / Asistencia Receptor)
            if (type === 'CS') { 
                p.stats.extra.cs++; 
                currentGameScore.pitchOuts++; 
                showToast("🎯 ¡LO AGARRÓ ROBANDO!");
            }
            
            // Registro estricto de errores de fildeo / pitcheo
            if (type === 'ERR') { 
                p.stats.extra.errors++; 
                showToast("⚠️ ERROR REGISTRADO EN LA DEFENSA");
            }

            // Verificación limpia de 3 outs de pitcheo por separado
            if (currentGameScore.pitchOuts >= 3) {
                currentGameScore.pitchOuts = 0;
                clearBases();
                rotatePlayer('pitcher');
                // Al completarse los outs de pitcheo, avanza automáticamente de fracción de Inning
                autoAdvanceInning();
            }
            save();
        }

        // Lógica de avance de bases automática
        function advanceRunners(basesAdvanced, isWalk = false) {
            let runsScored = 0;
            if (basesAdvanced === 4) {
                if(currentGameScore.bases.b1) runsScored++;
                if(currentGameScore.bases.b2) runsScored++;
                if(currentGameScore.bases.b3) runsScored++;
                runsScored++;
                currentGameScore.bases = { b1: false, b2: false, b3: false };
            } else if (isWalk) {
                if (currentGameScore.bases.b1) {
                    if (currentGameScore.bases.b2) {
                        if (currentGameScore.bases.b3) runsScored++;
                        currentGameScore.bases.b3 = true;
                    }
                    currentGameScore.bases.b2 = true;
                }
                currentGameScore.bases.b1 = true;
            } else {
                for (let i = 0; i < basesAdvanced; i++) {
                    if (currentGameScore.bases.b3) { runsScored++; currentGameScore.bases.b3 = false; }
                    if (currentGameScore.bases.b2) { currentGameScore.bases.b3 = true; currentGameScore.bases.b2 = false; }
                    if (currentGameScore.bases.b1) { currentGameScore.bases.b2 = true; currentGameScore.bases.b1 = false; }
                    if (i === 0) currentGameScore.bases.b1 = true;
                }
            }
            if(runsScored > 0) {
                currentGameScore.runs += runsScored;
                showToast(`🎉 ¡ANOTADAS +${runsScored} CARRERAS!`);
            }
        }

        function toggleManualBase(num) {
            if(num === 1) currentGameScore.bases.b1 = !currentGameScore.bases.b1;
            if(num === 2) currentGameScore.bases.b2 = !currentGameScore.bases.b2;
            if(num === 3) currentGameScore.bases.b3 = !currentGameScore.bases.b3;
            save();
        }

        function clearBases() {
            currentGameScore.bases = { b1: false, b2: false, b3: false };
        }

        function autoAdvanceInning() {
            if (currentGameScore.isTopInning) {
                currentGameScore.isTopInning = false; // Pasa de alta a baja
                showToast("📝 MITAD DEL INNING - PARTE BAJA");
            } else {
                currentGameScore.isTopInning = true; // Sube al siguiente inning parte alta
                currentGameScore.inning++;
                showToast(`⚾ INNING COMPLETADO - INICIA INNING ${currentGameScore.inning}`);
            }
        }

        function changeInningSide() {
            currentGameScore.isTopInning = !currentGameScore.isTopInning;
            showToast(currentGameScore.isTopInning ? "CAMBIO A PARTE ALTA ▲" : "CAMBIO A PARTE BAJA ▼");
            save();
        }

        function renderStats() {
            document.getElementById('statsContainer').innerHTML = players.map(p => {
                const ext = p.stats.extra || { h1: 0, h2: 0, h3: 0, bb: 0, outs: 0, sb: 0, cs: 0, errors: 0 };
                const rawAvg = p.stats.atBats > 0 ? (p.stats.hits / p.stats.atBats).toFixed(3) : "000";
                const avgDisplay = rawAvg.toString().replace("0.", "").replace("1.000", "1000");
                
                // ERA de por vida en el sistema
                const era = p.stats.pruns > 0 ? ((p.stats.pruns * 3) / Math.max(1, (p.stats.pk/2))).toFixed(2) : "0.00";

                return `
                <div class="card p-5 border-l-4 border-blue-500">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-black uppercase">${p.name}</h3>
                        <div class="flex gap-2">
                            <span class="bg-blue-600 px-2 py-1 rounded text-[10px] font-bold text-white">AVG: ${avgDisplay}</span>
                            <span class="bg-red-600 px-2 py-1 rounded text-[10px] font-bold text-white">ERA: ${era}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-center text-xs">
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">VB</p><p class="font-bold">${p.stats.atBats}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">HITS</p><p class="font-bold">${p.stats.hits}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">1B</p><p class="font-bold">${ext.h1||0}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">2B/3B</p><p class="font-bold">${ext.h2||0}/${ext.h3||0}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">HR</p><p class="font-bold">${p.stats.hr}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">RBI</p><p class="font-bold">${p.stats.rbi}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-[8px] text-slate-400">BB</p><p class="font-bold">${ext.bb||0}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-cyan-400">
                            <p class="text-[8px] text-slate-400">ROBOS (BR)</p><p class="font-bold">${ext.sb||0}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-rose-400">
                            <p class="text-[8px] text-slate-400">OUT ROB (OR)</p><p class="font-bold">${ext.cs||0}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-red-400">
                            <p class="text-[8px] text-slate-400">K PITCH</p><p class="font-bold">${p.stats.pk}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-amber-400">
                            <p class="text-[8px] text-slate-400">ERRORES (E)</p><p class="font-bold">${ext.errors||0}</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-red-300">
                            <p class="text-[8px] text-slate-400">C. PERM</p><p class="font-bold">${p.stats.pruns}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function resetSeasonStats() {
            if(confirm("¿Poner todas las estadísticas de los jugadores en 0? (No se borrarán los nombres)")) {
                players.forEach(p => {
                    p.stats = { atBats:0, hits:0, hr:0, rbi:0, pk:0, pruns:0, extra: {h1:0, h2:0, h3:0, bb:0, outs:0, sb:0, cs:0, errors:0} };
                });
                save();
            }
        }

        function toggleGame() {
            if (!isGameActive) {
                if (players.length === 0) return showToast("⚠️ ¡Añade jugadores primero!");
                isGameActive = true;
                currentGameScore = { runs: 0, allowed: 0, pitchOuts: 0, batOuts: 0, inning: 1, isTopInning: true, bases: { b1: false, b2: false, b3: false } };
                activeSelection = { batterId: players[0].id, pitcherId: players[0].id };
            } else {
                if (!confirm("¿Finalizar partido actual?")) return;
                isGameActive = false;
            }
            save();
        }

        function rotatePlayer(type) {
            if (players.length < 2) return;
            const currentId = activeSelection[type === 'batter' ? 'batterId' : 'pitcherId'];
            let currentIndex = players.findIndex(p => p.id == currentId);
            let nextIndex = (currentIndex + 1) % players.length;
            activeSelection[type === 'batter' ? 'batterId' : 'pitcherId'] = players[nextIndex].id;
        }

        function updateDropdowns() {
            const bSelect = document.getElementById('activeBatter');
            const pSelect = document.getElementById('activePitcher');
            const options = '<option value="">ELIJE JUGADOR</option>' + players.map(p => `<option value="${p.id}">${p.name.toUpperCase()}</option>`).join('');
            bSelect.innerHTML = options; pSelect.innerHTML = options;
            if(activeSelection.batterId) bSelect.value = activeSelection.batterId;
            if(activeSelection.pitcherId) pSelect.value = activeSelection.pitcherId;
        }

        function manualUserChange() {
            activeSelection.batterId = document.getElementById('activeBatter').value;
            activeSelection.pitcherId = document.getElementById('activePitcher').value;
            save();
        }

        function updateStatusUI() {
            const controls = document.getElementById('game-controls');
            const btn = document.getElementById('btn-toggle-game');
            const indicator = document.getElementById('game-status-indicator');
            if (isGameActive) {
                controls.classList.remove('opacity-30', 'pointer-events-none');
                document.getElementById('game-btn-text').innerText = "FINALIZAR PARTIDO";
                btn.className = "px-8 py-3 bg-red-600 hover:bg-red-500 text-white rounded-full font-black text-lg shadow-lg flex items-center gap-3";
                indicator.innerText = "• PARTIDO EN VIVO •";
                indicator.className = "px-4 py-1 rounded-full text-xs font-black bg-green-500/20 text-green-400 border border-green-500/50 w-fit";
            } else {
                controls.classList.add('opacity-30', 'pointer-events-none');
                document.getElementById('game-btn-text').innerText = "EMPEZAR PARTIDO";
                btn.className = "px-8 py-3 bg-green-600 hover:bg-green-500 text-white rounded-full font-black text-lg shadow-lg flex items-center gap-3";
                indicator.innerText = "ESPERANDO PARTIDO";
                indicator.className = "px-4 py-1 rounded-full text-xs font-black bg-red-500/20 text-red-400 border border-red-500/50 w-fit";
            }
        }

        function addPlayer() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if (name) {
                players.push({ id: Date.now(), name, stats: { atBats:0, hits:0, hr:0, rbi:0, pk:0, pruns:0, extra: {h1:0, h2:0, h3:0, bb:0, outs:0, sb:0, cs:0, errors:0} } });
                input.value = '';
                save();
            }
        }

        function renderPlayerList() {
            document.getElementById('playerList').innerHTML = players.map(p => `
                <div class="flex justify-between p-3 bg-slate-800 rounded-xl mb-2 border border-slate-700">
                    <span>👤 ${p.name}</span>
                    <button onclick="removePlayer(${p.id})" class="text-red-400">✕</button>
                </div>
            `).join('');
        }

        function removePlayer(id) { if(confirm("¿Eliminar de la base de datos?")) { players = players.filter(p => p.id !== id); save(); } }

        function viewSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white'));
            document.getElementById('nav-' + id).classList.add('bg-blue-600', 'text-white');
        }

        function clearHistory() {
            if(confirm("¿ELIMINAR TODO EL HISTORIAL Y TODOS LOS JUGADORES?")) {
                players = []; isGameActive = false;
                currentGameScore = { runs: 0, allowed: 0, pitchOuts: 0, batOuts: 0, inning: 1, isTopInning: true, bases: { b1: false, b2: false, b3: false } };
                activeSelection = { batterId: "", pitcherId: "" };
                save();
            }
        }

        function showHR() {
            const ov = document.getElementById('hr-overlay');
            ov.style.display = 'flex';
            setTimeout(() => ov.style.display = 'none', 2500);
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.remove('opacity-0', 'translate-y-24');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-24'), 2500);
        }

        window.onload = () => viewSection('game');
    </script>
</body>
</html>
